spring.application.name=backend

# Local secrets: optional backend/.env (gitignored), KEY=value per line. Real env vars take precedence.
spring.config.import=optional:file:.env[.properties]

# --- Database (PostgreSQL, e.g. Supabase). See .env.example. ---
# Runtime connection: least-privilege role (data access only, no DDL).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Hosted Postgres plans cap connections; keep the pool small.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.pool-name=taskmanager-pool

# Dedicated schema: keeps app tables out of Supabase's auto-exposed "public" REST API.
app.db.schema=${DB_SCHEMA:taskmanager}

# --- Migrations (Flyway owns the schema; runs as the schema owner) ---
spring.flyway.user=${DB_MIGRATION_USERNAME:${DB_USERNAME}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
spring.flyway.schemas=${app.db.schema}
spring.flyway.default-schema=${app.db.schema}
# Placeholder for migration V4 (lower-case key: Spring's relaxed binding normalizes map keys).
spring.flyway.placeholders.approle=${DB_APP_ROLE:taskmanager_app}

# --- JPA / Hibernate ---
spring.jpa.properties.hibernate.default_schema=${app.db.schema}
spring.jpa.hibernate.ddl-auto=validate
# Shared with the development migration generator in pom.xml.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.open-in-view=false
# Business time zone: decides when a due date has passed (IANA id, e.g. Asia/Dhaka).
app.time-zone=${APP_TIME_ZONE:UTC}
# Store and read timestamps in UTC regardless of server time zone.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Web ---
# Comma-separated browser origins allowed to call the API (dev uses the Vite proxy).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Authentication ---
# Where the SPA runs; password reset links point here.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Sessions live in PostgreSQL (tables created by Flyway V7, not by Spring Session).
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=${app.db.schema}.spring_session
# Signed out after this much inactivity.
server.servlet.session.timeout=${SESSION_TIMEOUT:12h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true wherever the site is served over HTTPS (any real deployment).
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# --- Operations ---
# Only the health endpoint is exposed; it includes database connectivity.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# OpenAPI docs: /swagger-ui.html and /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAPI: document only the public API, not actuator endpoints
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
# Never put stack traces in error responses (devtools enables them in development)
server.error.include-stacktrace=never

# --- Auth abuse protection (bounded, per backend instance) ---
app.auth.rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
app.auth.rate-limit.window=${AUTH_RATE_LIMIT_WINDOW:1m}
app.auth.rate-limit.attempts-per-ip=${AUTH_ATTEMPTS_PER_IP:60}
app.auth.rate-limit.attempts-per-account=${AUTH_ATTEMPTS_PER_ACCOUNT:10}
app.auth.rate-limit.max-keys=${AUTH_RATE_LIMIT_MAX_KEYS:10000}

# Correlation is carried by MDC and returned in X-Request-ID and API metadata.
logging.pattern.level=%5p [requestId=%X{requestId:-none}]
logging.level.com.example.backend=${APP_LOG_LEVEL:INFO}
